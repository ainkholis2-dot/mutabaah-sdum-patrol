<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - SDUM Patrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">🎉 BERHASIL MASUK DASHBOARD ADMIN!</h1>
    <p class="text-sm text-slate-600 mb-4">Selamat datang, <span id="namaAdmin" class="font-bold">Admin</span></p>
    
    <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-800 mb-4">
      Jika kamu bisa melihat halaman ini, artinya masalah pengalihan halaman dari <code>index.html</code> sudah SELESAI.
    </div>

    <button onclick="logout()" class="bg-red-600 text-white text-xs px-4 py-2 rounded font-semibold hover:bg-red-700 transition">
      Keluar (Logout) 🚪
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const rawUser = localStorage.getItem('currentUser');
      
      // 1. Cek Apakah Sudah Login
      if (!rawUser) {
        alert("Akses ditolak! Silakan login terlebih dahulu.");
        window.location.href = "index.html";
        return;
      }

      const user = JSON.parse(rawUser);

      // 2. Cek Apakah User Berperan Sebagai Admin
      if (user.role !== 'Admin') {
        alert("Akses ditolak! Halaman ini khusus untuk Admin.");
        window.location.href = "index.html";
        return;
      }

      // 3. Tampilkan Nama Admin
      document.getElementById('namaAdmin').innerText = user.nama || user.username || "Admin";
    });

    // Fungsi Logout
    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
