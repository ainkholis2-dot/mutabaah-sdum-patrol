<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUDNPQW8LLPG9AJhJROzyoB5SYQtQ8UB0RLTnPPYw6bHWZV3wfDtXhLXL55jCmaGECIQ/exec";

  document.addEventListener("DOMContentLoaded", () => {
    // Cek Session Admin
    const rawUser = localStorage.getItem('currentUser');
    if (!rawUser) { window.location.href = "index.html"; return; }
    
    const user = JSON.parse(rawUser);
    if (user.role !== 'Admin') {
      alert("Akses ditolak! Halaman ini khusus Admin.");
      window.location.href = "form-input-guru.html";
      return;
    }

    // Load Data Rekap Sinkron dari Google Sheet
    loadDashboardAdmin();
  });

  async function loadDashboardAdmin() {
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "get_admin_dashboard_data" })
      });
      const result = await res.json();

      if (result.success) {
        renderTabelTahfidz(result.tahfidz);
        renderTabelMengaji(result.mengaji);
      } else {
        console.error("Gagal mengambil rekap data Admin:", result.message);
      }
    } catch (err) {
      console.error("Koneksi Error:", err);
    }
  }

  function renderTabelTahfidz(data) {
    const tbody = document.getElementById('tbodyTahfidz'); // Pastikan ID ini ada di elemen <tbody> tabel Tahfidz Admin
    if (!tbody) return;
    tbody.innerHTML = "";

    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-slate-400">Belum ada data setoran Tahfidz</td></tr>`;
      return;
    }

    data.forEach((row, idx) => {
      tbody.innerHTML += `
        <tr class="border-b text-xs hover:bg-slate-50">
          <td class="p-3 text-center">${idx + 1}</td>
          <td class="p-3">${row.tanggal}</td>
          <td class="p-3 font-semibold text-slate-700">${row.santri}</td>
          <td class="p-3"><span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-medium">${row.jenis}</span></td>
          <td class="p-3">${row.juz} - ${row.surat} (Ayat ${row.ayat})</td>
          <td class="p-3 font-bold text-center">${row.nilai}</td>
          <td class="p-3 text-slate-500">${row.catatan || '-'}</td>
        </tr>
      `;
    });
  }

  function renderTabelMengaji(data) {
    const tbody = document.getElementById('tbodyMengaji'); // Pastikan ID ini ada di elemen <tbody> tabel Mengaji Admin
    if (!tbody) return;
    tbody.innerHTML = "";

    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-slate-400">Belum ada data setoran Mengaji</td></tr>`;
      return;
    }

    data.forEach((row, idx) => {
      tbody.innerHTML += `
        <tr class="border-b text-xs hover:bg-slate-50">
          <td class="p-3 text-center">${idx + 1}</td>
          <td class="p-3">${row.tanggal}</td>
          <td class="p-3 font-semibold text-slate-700">${row.santri}</td>
          <td class="p-3"><span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md font-medium">${row.jilid}</span></td>
          <td class="p-3">${row.detail}</td>
          <td class="p-3 font-bold text-center">${row.nilai}</td>
        </tr>
      `;
    });
  }
</script>
