<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutaba'ah Anak Unggulan - SD Unggulan Muhammadiyah Patrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full border border-emerald-100 text-center">
    
    <!-- Logo Muhammadiyah & Header -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Logo_Muhammadiyah.svg/500px-Logo_Muhammadiyah.svg.png" 
         alt="Logo Muhammadiyah" 
         class="h-24 mx-auto mb-4 object-contain">
    
    <h2 class="text-xs font-bold tracking-widest text-emerald-700 uppercase">SD Unggulan Muhammadiyah Patrol</h2>
    <h1 class="text-2xl font-extrabold text-gray-800 mt-1 mb-6">Mutaba'ah Anak Unggulan</h1>

    <!-- Form Login Single Door -->
    <form id="loginForm" class="space-y-4 text-left">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username / NISN</label>
        <input type="text" id="username" required placeholder="Masukkan Username atau NISN" 
               class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi / PIN</label>
        <input type="password" id="password" required placeholder="Masukkan Password / PIN" 
               class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
      </div>

      <button type="submit" id="btnLogin"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200 mt-2">
        Masuk Aplikasi
      </button>
    </form>

    <p class="text-xs text-gray-400 mt-6">© SD Unggulan Muhammadiyah Patrol</p>
  </div>

  <script>
    // Link Apps Script Terbaru Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUDNPQW8LLPG9AJhJROzyoB5SYQtQ8UB0RLTnPPYw6bHWZV3wfDtXhLXL55jCmaGECIQ/exec";

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnLogin');
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      btn.innerText = "Memeriksa...";
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "login", 
            username: usernameInput,
            password: passwordInput
          })
        });

        const result = await response.json();

        if (result.success) {
          const user = result.user || result;
          alert(`Login Berhasil!\nSelamat datang, ${user.nama || user.username} (${user.role})`);

          // Simpan data session login
          localStorage.setItem('currentUser', JSON.stringify(user));

          // Pengarahan Halaman
          if (user.role === 'Guru') {
            window.location.href = "form-input-guru.html";
          } else if (user.role === 'Wali Murid') {
            window.location.href = "laporan-walimurid.html";
          } else if (user.role === 'Admin') {
            window.location.href = "dashboard-admin.html";
          }
        } else {
          alert(`Gagal Login: ${result.message || 'Username atau Password salah.'}`);
        }
      } catch (error) {
        console.error("Error Detail:", error);
        alert("Terjadi kesalahan koneksi ke server.");
      } finally {
        btn.innerText = "Masuk Aplikasi";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
