<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Siswa - Asesmen & Latihan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-6">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header Siswa -->
    <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 id="namaSiswa" class="text-xl font-bold text-slate-800">Selamat Datang, Siswa</h1>
        <p id="infoKelas" class="text-sm text-slate-500">Kelas: - | NISN: -</p>
      </div>
      <button onclick="logout()" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 font-semibold px-3 py-2 rounded-lg transition">
        Keluar
      </button>
    </div>

    <!-- Area Card Soal/Ujian -->
    <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 space-y-6">
      <div class="border-b border-slate-100 pb-4 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-800">Asesmen / Latihan Harian</h2>
        <span id="badgeStatus" class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full">Siap Mengerjakan</span>
      </div>

      <!-- Container Soal (Dinamis dari JS) -->
      <form id="formUjian" class="space-y-6">
        <div id="containerSoal" class="space-y-6 text-slate-700">
          <p class="text-center text-slate-400 py-8">Memuat soal ujian...</p>
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md transition hidden">
          Kirim Jawaban
        </button>
      </form>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUDNPQW8LLPG9AJhJROzyoB5SYQtQ8UB0RLTnPPYw6bHWZV3wfDtXhLXL55jCmaGECIQ/exec";
    
    // Ambil Data Session Login
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
      window.location.href = "index.html";
    }

    document.getElementById('namaSiswa').innerText = `Selamat Datang, ${currentUser.nama || currentUser.username}`;
    document.getElementById('infoKelas').innerText = `Kelas: ${currentUser.kelas || '-'} | NISN: ${currentUser.username}`;

    let daftarSoalGlobal = [];

    // Fitur Pengaman Tambahan (Mencegah Copy-Paste & Tab Switching sederhana)
    document.addEventListener('contextmenu', e => e.preventDefault()); // Disable Klik Kanan

    // Load Soal saat halaman dibuka
    async function loadSoal() {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "getSoalSiswa",
            kelas: currentUser.kelas || "Kelas 1"
          })
        });

        const res = await response.json();
        if (res.success && res.data.length > 0) {
          daftarSoalGlobal = res.data;
          renderSoal(res.data);
          document.getElementById('btnSubmit').classList.remove('hidden');
        } else {
          document.getElementById('containerSoal').innerHTML = `<p class="text-center text-slate-400 py-8">Belum ada latihan/asesmen aktif untuk kelas Anda.</p>`;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('containerSoal').innerHTML = `<p class="text-center text-red-500 py-8">Gagal memuat soal. Periksa koneksi Anda.</p>`;
      }
    }

    function renderSoal(soalList) {
      const container = document.getElementById('containerSoal');
      container.innerHTML = soalList.map((item, index) => `
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
          <p class="font-semibold text-slate-800">${index + 1}. ${item.pertanyaan}</p>
          <div class="space-y-2 pl-2">
            ${Object.keys(item.opsi).map(key => `
              <label class="flex items-center space-x-3 cursor-pointer p-2 rounded-lg hover:bg-white transition border border-transparent hover:border-slate-200">
                <input type="radio" name="soal_${item.idSoal}" value="${key}" required class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
                <span class="text-sm text-slate-700"><b>${key}.</b> ${item.opsi[key]}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // Submit Jawaban
    document.getElementById('formUjian').addEventListener('submit', async function(e) {
      e.preventDefault();

      if(!confirm("Apakah Anda yakin ingin mengirim jawaban ini?")) return;

      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Mengirim Jawaban...";
      btn.disabled = true;

      // Ambil jawaban pilihan siswa
      const jawabanSiswa = {};
      daftarSoalGlobal.forEach(item => {
        const selected = document.querySelector(`input[name="soal_${item.idSoal}"]:checked`);
        if (selected) {
          jawabanSiswa[item.idSoal] = selected.value;
        }
      });

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "submitUjian",
            nisn: currentUser.username,
            nama: currentUser.nama || currentUser.username,
            kelas: currentUser.kelas || "-",
            judulUjian: "Asesmen Harian",
            jawabanSiswa: jawabanSiswa
          })
        });

        const res = await response.json();
        if (res.success) {
          alert(`Alhamdulillah! ${res.message}`);
          window.location.reload();
        }
      } catch (err) {
        alert("Terjadi kesalahan saat mengunggah jawaban.");
      } finally {
        btn.innerText = "Kirim Jawaban";
        btn.disabled = false;
      }
    });

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = "index.html";
    }

    loadSoal();
  </script>
</body>
</html>
