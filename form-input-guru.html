<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Mutaba'ah - SDUM Patrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

  <!-- Header / Navbar Guru -->
  <header class="bg-emerald-800 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Logo_Muhammadiyah.svg/500px-Logo_Muhammadiyah.svg.png" 
             alt="Logo Muhammadiyah" class="h-9 w-9 object-contain bg-white rounded-full p-1">
        <div>
          <h1 class="font-bold text-sm leading-tight">Form Setoran Hafalan</h1>
          <p class="text-[11px] text-emerald-200">Ustadz/Ustzah: <span id="namaUstadzText" class="font-bold text-amber-300">-</span></p>
        </div>
      </div>
      <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg transition font-semibold text-white shadow">
        Keluar 🚪
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- Tab Pilih Program -->
    <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 mb-6 text-sm font-bold text-slate-600">
      <button id="btnTabTahfidz" onclick="pilihProgram('tahfidz')" class="w-1/2 py-2.5 bg-emerald-700 text-white rounded-lg shadow transition">
        📖 Program Tahfidz
      </button>
      <button id="btnTabMengaji" onclick="pilihProgram('mengaji')" class="w-1/2 py-2.5 hover:text-emerald-700 transition">
        📚 Program Mengaji
      </button>
    </div>

    <!-- FORM SETORAN TAHFIDZ -->
    <form id="formTahfidz" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-base font-bold text-emerald-800 border-b pb-2">Form Setoran Tahfidz</h2>

      <!-- Pilih Santri terintegrasi dari Master Data Admin -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri Bimbingan</label>
        <select id="selectSiswaTahfidz" onchange="autoFillSiswaTahfidz()" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
          <option value="">-- Memuat Data Santri... --</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">NISN</label>
          <input type="text" id="nisnTahfidz" readonly class="w-full px-3 py-2 border rounded-lg text-xs bg-slate-100 font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas</label>
          <input type="text" id="kelasTahfidz" readonly class="w-full px-3 py-2 border rounded-lg text-xs bg-slate-100">
        </div>
      </div>

      <!-- FITUR BARU: Pilihan Juz & Surat Otomatis -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Juz</label>
          <select id="juzTahfidz" onchange="updateDaftarSurah()" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
            <option value="">-- Pilih Juz --</option>
            <option value="Juz 30">Juz 30</option>
            <option value="Juz 29">Juz 29</option>
            <option value="Juz 1">Juz 1</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Surah</label>
          <select id="surahTahfidz" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
            <option value="">-- Pilih Juz Terlebih Dahulu --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Ayat</label>
          <input type="text" id="ayatTahfidz" placeholder="Misal: 1 - 15" required class="w-full px-3 py-2 border rounded-lg text-xs">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nilai / Predikat</label>
          <select id="nilaiTahfidz" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
            <option value="Mumtaz (Sangat Baik)">Mumtaz (Sangat Baik)</option>
            <option value="Jayyid Jiddan (Baik Sekali)">Jayyid Jiddan (Baik Sekali)</option>
            <option value="Jayyid (Baik)">Jayyid (Baik)</option>
            <option value="Maqbul (Cukup)">Maqbul (Cukup)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Setoran</label>
          <input type="date" id="tglTahfidz" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Ustadz</label>
        <textarea id="catatanTahfidz" rows="2" placeholder="Catatan tajwid/kelancaran hafalan..." class="w-full px-3 py-2 border rounded-lg text-xs"></textarea>
      </div>

      <button type="submit" id="btnSimpanT" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">
        💾 Simpan Setoran Tahfidz
      </button>
    </form>


    <!-- FORM SETORAN MENGAJI -->
    <form id="formMengaji" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 hidden">
      <h2 class="text-base font-bold text-amber-800 border-b pb-2">Form Setoran Mengaji / Ummi / Iqro</h2>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri Bimbingan</label>
        <select id="selectSiswaMengaji" onchange="autoFillSiswaMengaji()" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
          <option value="">-- Memuat Data Santri... --</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">NISN</label>
          <input type="text" id="nisnMengaji" readonly class="w-full px-3 py-2 border rounded-lg text-xs bg-slate-100 font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kelompok</label>
          <input type="text" id="kelompokMengaji" readonly class="w-full px-3 py-2 border rounded-lg text-xs bg-slate-100">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Jilid / Buku</label>
          <input type="text" id="jilidMengaji" placeholder="Misal: Jilid 3 / Al-Qur'an" required class="w-full px-3 py-2 border rounded-lg text-xs">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Halaman / Hal</label>
          <input type="text" id="halamanMengaji" placeholder="Misal: Hal 12 - 14" required class="w-full px-3 py-2 border rounded-lg text-xs">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nilai</label>
          <select id="nilaiMengaji" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
            <option value="Lanjut (A)">Lanjut (A)</option>
            <option value="Lanjut dengan Catatan (B)">Lanjut dengan Catatan (B)</option>
            <option value="Ulang Halaman (C)">Ulang Halaman (C)</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Setoran</label>
          <input type="date" id="tglMengaji" required class="w-full px-3 py-2 border rounded-lg text-xs bg-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Ustadz</label>
          <input type="text" id="catatanMengaji" placeholder="Catatan kelancaran..." class="w-full px-3 py-2 border rounded-lg text-xs">
        </div>
      </div>

      <button type="submit" id="btnSimpanM" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-xl text-xs shadow transition">
        💾 Simpan Setoran Mengaji
      </button>
    </form>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDr9EBRi8hTsmPMCydkgMcn8g_cTBJdHGE8033gdPRnRrZ1TEG4G7-gS5U3sBvhhMXOA/exec"; // <-- Masukkan URL Web App kamu
    let currentUser = null;
    let listSiswaTahfidz = [];
    let listSiswaMengaji = [];

    // Daftar Surah Otomatis per Juz
    const surahMap = {
      "Juz 30": ["An-Naba'", "An-Nazi'at", "'Abasa", At-Takwir", "Al-Infitar", "Al-Mutaffifin", "Al-Inshiqaq", "Al-Buruj", "At-Tariq", "Al-A'la", "Al-Ghashiyah", "Al-Fajr", "Al-Balad", "Ash-Shams", "Al-Lail", "Ad-Duha", "Ash-Sharh", "At-Tin", "Al-'Alaq", "Al-Qadr", "Al-Bayyinah", "Az-Zalzalah", "Al-'Adiyat", "Al-Qari'ah", "At-Takathur", "Al-'Asr", "Al-Humazah", "Al-Fil", "Quraish", "Al-Ma'un", "Al-Kawthar", "Al-Kafirun", "An-Nasr", "Al-Masad", "Al-Ikhlas", "Al-Falaq", "An-Nas"],
      "Juz 29": ["Al-Mulk", "Al-Qalam", "Al-Haqqah", "Al-Ma'arij", "Nuh", "Al-Jinn", "Al-Muzzammil", "Al-Muddaththir", "Al-Qiyamah", "Al-Insan", "Al-Mursalat"],
      "Juz 1": ["Al-Fatihah", "Al-Baqarah (Ayat 1-141)"]
    };

    document.addEventListener("DOMContentLoaded", () => {
      const rawUser = localStorage.getItem('currentUser');
      if (!rawUser) { window.location.href = "index.html"; return; }
      currentUser = JSON.parse(rawUser);

      document.getElementById('namaUstadzText').innerText = currentUser.nama || currentUser.username;
      
      // Set Default Tanggal Hari ini
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('tglTahfidz').value = today;
      document.getElementById('tglMengaji').value = today;

      // Muat Data Siswa Terintegrasi untuk Ustadz yang sedang Login
      loadMasterSiswa();
    });

    // Update Dropdown Surah Berdasarkan Juz
    function updateDaftarSurah() {
      const juz = document.getElementById('juzTahfidz').value;
      const selectSurah = document.getElementById('surahTahfidz');
      selectSurah.innerHTML = '<option value="">-- Pilih Surah --</option>';

      if (juz && surahMap[juz]) {
        surahMap[juz].forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          selectSurah.appendChild(opt);
        });
      }
    }

    async function loadMasterSiswa() {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "get_siswa_guru", namaGuru: currentUser.nama })
        });
        const result = await res.json();

        if (result.success) {
          listSiswaTahfidz = result.tahfidz || [];
          listSiswaMengaji = result.mengaji || [];

          // Render Dropdown Tahfidz
          const selT = document.getElementById('selectSiswaTahfidz');
          selT.innerHTML = '<option value="">-- Pilih Santri Tahfidz --</option>';
          listSiswaTahfidz.forEach((s, idx) => {
            selT.innerHTML += `<option value="${idx}">${s.nama} (${s.kelas})</option>`;
          });

          // Render Dropdown Mengaji
          const selM = document.getElementById('selectSiswaMengaji');
          selM.innerHTML = '<option value="">-- Pilih Santri Mengaji --</option>';
          listSiswaMengaji.forEach((s, idx) => {
            selM.innerHTML += `<option value="${idx}">${s.nama} (${s.kelompok})</option>`;
          });
        }
      } catch (err) {
        alert("Gagal memuat data santri bimbingan.");
      }
    }

    function autoFillSiswaTahfidz() {
      const idx = document.getElementById('selectSiswaTahfidz').value;
      if (idx !== "") {
        const s = listSiswaTahfidz[idx];
        document.getElementById('nisnTahfidz').value = s.nisn;
        document.getElementById('kelasTahfidz').value = s.kelas;
      }
    }

    function autoFillSiswaMengaji() {
      const idx = document.getElementById('selectSiswaMengaji').value;
      if (idx !== "") {
        const s = listSiswaMengaji[idx];
        document.getElementById('nisnMengaji').value = s.nisn;
        document.getElementById('kelompokMengaji').value = s.kelompok;
      }
    }

    function pilihProgram(prog) {
      const fT = document.getElementById('formTahfidz');
      const fM = document.getElementById('formMengaji');
      const bT = document.getElementById('btnTabTahfidz');
      const bM = document.getElementById('btnTabMengaji');

      if (prog === 'tahfidz') {
        fT.classList.remove('hidden'); fM.classList.add('hidden');
        bT.className = "w-1/2 py-2.5 bg-emerald-700 text-white rounded-lg shadow transition font-bold";
        bM.className = "w-1/2 py-2.5 text-slate-600 hover:text-emerald-700 transition font-bold";
      } else {
        fM.classList.remove('hidden'); fT.classList.add('hidden');
        bM.className = "w-1/2 py-2.5 bg-amber-500 text-slate-900 rounded-lg shadow transition font-bold";
        bT.className = "w-1/2 py-2.5 text-slate-600 hover:text-amber-600 transition font-bold";
      }
    }

    // SUBMIT TAHFIDZ
    document.getElementById('formTahfidz').addEventListener('submit', async (e) => {
      e.preventDefault();
      const idx = document.getElementById('selectSiswaTahfidz').value;
      if (idx === "") { alert("Pilih santri terlebih dahulu!"); return; }
      
      const siswa = listSiswaTahfidz[idx];
      const payload = {
        action: "simpan_setoran_tahfidz",
        tanggal: document.getElementById('tglTahfidz').value,
        nisn: siswa.nisn,
        nama: siswa.nama,
        kelas: siswa.kelas,
        juz: document.getElementById('juzTahfidz').value,
        surah: document.getElementById('surahTahfidz').value,
        ayat: document.getElementById('ayatTahfidz').value,
        nilai: document.getElementById('nilaiTahfidz').value,
        catatan: document.getElementById('catatanTahfidz').value,
        guru: currentUser.nama || currentUser.username
      };

      await kirimSetoran(payload, e.target);
    });

    // SUBMIT MENGAJI
    document.getElementById('formMengaji').addEventListener('submit', async (e) => {
      e.preventDefault();
      const idx = document.getElementById('selectSiswaMengaji').value;
      if (idx === "") { alert("Pilih santri terlebih dahulu!"); return; }

      const siswa = listSiswaMengaji[idx];
      const payload = {
        action: "simpan_setoran_mengaji",
        tanggal: document.getElementById('tglMengaji').value,
        nisn: siswa.nisn,
        nama: siswa.nama,
        kelompok: siswa.kelompok,
        jilid: document.getElementById('jilidMengaji').value,
        halaman: document.getElementById('halamanMengaji').value,
        nilai: document.getElementById('nilaiMengaji').value,
        catatan: document.getElementById('catatanMengaji').value,
        guru: currentUser.nama || currentUser.username
      };

      await kirimSetoran(payload, e.target);
    });

    async function kirimSetoran(payload, formEl) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
          alert("Alhamdulillah! " + result.message);
          formEl.reset();
          loadMasterSiswa();
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        alert("Kesalahan koneksi.");
      }
    }

    function logout() { localStorage.removeItem('currentUser'); window.location.href = "index.html"; }
  </script>
</body>
</html>
