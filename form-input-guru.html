<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Guru - Mutaba'ah SDUM Patrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

  <!-- Header / Navbar -->
  <header class="bg-emerald-800 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Logo_Muhammadiyah.svg/500px-Logo_Muhammadiyah.svg.png" 
             alt="Logo Muhammadiyah" class="h-10 w-10 object-contain bg-white rounded-full p-1">
        <div>
          <h1 class="font-bold text-sm leading-tight">Form Input Mutaba'ah</h1>
          <p class="text-[11px] text-emerald-200">SD Unggulan Muhammadiyah Patrol</p>
        </div>
      </div>
      <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg font-semibold text-white transition shadow">
        Keluar 🚪
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- Card Informasi Penguji -->
    <div class="bg-emerald-700 text-white p-5 rounded-2xl shadow-md mb-6 flex justify-between items-center">
      <div>
        <p class="text-xs text-emerald-200">Ustadz / Ustadzah Penguji:</p>
        <h2 id="namaGuru" class="text-xl font-bold mt-0.5">Memuat...</h2>
      </div>
      <a href="dashboard-admin.html" id="linkAdmin" class="hidden text-xs bg-emerald-900 hover:bg-emerald-950 text-white px-3 py-2 rounded-xl transition border border-emerald-500">
        Panel Admin ⚙️
      </a>
    </div>

    <!-- Switcher Program -->
    <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 mb-6 flex gap-2">
      <button id="btnTabTahfidz" onclick="switchProgram('tahfidz')" class="flex-1 py-3 text-xs font-bold rounded-xl transition bg-emerald-700 text-white shadow">
        📖 Program Tahfidz
      </button>
      <button id="btnTabMengaji" onclick="switchProgram('mengaji')" class="flex-1 py-3 text-xs font-bold rounded-xl transition bg-slate-100 text-slate-600 hover:bg-slate-200">
        📚 Program Mengaji
      </button>
    </div>

    <!-- ========================================================= -->
    <!-- 1. FORM INPUT PROGRAM TAHFIDZ -->
    <!-- ========================================================= -->
    <div id="formTahfidz" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h3 class="text-base font-bold text-emerald-800 mb-4 pb-2 border-b">Setoran Hafalan (Tahfidz)</h3>
      
      <form id="inputTahfidzForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal Setoran</label>
            <input type="date" id="tglTahfidz" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Pilih Santri (Tahfidz)</label>
            <!-- PERUBAHAN: Menggunakan SELECT Dropdown -->
            <select id="santriTahfidz" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
              <option value="">Memuat data santri...</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis Setoran</label>
          <select id="jenisSetoranTahfidz" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="Ziyadah">Ziyadah (Hafalan Baru)</option>
            <option value="Muroja'ah">Muroja'ah (Mengulang Hafalan)</option>
            <option value="Tasmi'">Tasmi' (Ujian Hafalan Sekali Duduk)</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Pilihan Juz</label>
            <select id="juzTahfidz" onchange="updateDaftarSurat()" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">-- Pilih Juz --</option>
              <option value="Juz 30">Juz 30</option>
              <option value="Juz 29">Juz 29</option>
              <option value="Juz 1">Juz 1</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Pilihan Surah</label>
            <select id="suratTahfidz" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">-- Pilih Juz Terlebih Dahulu --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 bg-emerald-50/50 p-3 rounded-xl border border-emerald-100">
          <div>
            <label class="block text-xs font-semibold text-emerald-900 mb-1">Ayat Awal</label>
            <input type="number" id="ayatAwalTahfidz" min="1" placeholder="Contoh: 1" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-emerald-900 mb-1">Ayat Akhir</label>
            <input type="number" id="ayatAkhirTahfidz" min="1" placeholder="Contoh: 15" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nilai / Predikat</label>
            <select id="nilaiTahfidz" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="A+">A+ (Mumtaz / Sangat Lancar)</option>
              <option value="A">A (Lancar)</option>
              <option value="B+">B+ (Cukup Lancar)</option>
              <option value="B">B (Kurang Lancar)</option>
              <option value="B-">B- (Perlu Mengulang)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor WhatsApp Orang Tua (Opsional)</label>
            <input type="tel" id="noWaTahfidz" placeholder="Contoh: 628123456789" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Catatan Ustadz / Ustadzah</label>
          <textarea id="catatanTahfidz" rows="2" placeholder="Catatan tajwid/kelancaran santri..." class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 pt-2">
          <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition shadow">
            💾 Simpan Data Tahfidz
          </button>
          <button type="button" onclick="shareWA('tahfidz')" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-3 rounded-xl text-xs transition shadow flex items-center justify-center gap-1.5">
            <span>📲 Kirim Laporan WA</span>
          </button>
        </div>
      </form>
    </div>

    <!-- ========================================================= -->
    <!-- 2. FORM INPUT PROGRAM MENGAJI -->
    <!-- ========================================================= -->
    <div id="formMengaji" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hidden">
      <h3 class="text-base font-bold text-emerald-800 mb-4 pb-2 border-b">Setoran Bacaan (Mengaji)</h3>
      
      <form id="inputMengajiForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal Setoran</label>
            <input type="date" id="tglMengaji" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Pilih Santri (Mengaji)</label>
            <!-- PERUBAHAN: Menggunakan SELECT Dropdown -->
            <select id="santriMengaji" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
              <option value="">Memuat data santri...</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Kategori / Jilid Mengaji</label>
          <select id="jilidMengaji" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">-- Pilih Jilid / Program --</option>
            <option value="Jilid 1">Jilid 1</option>
            <option value="Jilid 2">Jilid 2</option>
            <option value="Jilid 3">Jilid 3</option>
            <option value="Jilid 4">Jilid 4</option>
            <option value="Jilid 5">Jilid 5</option>
            <option value="Jilid 6">Jilid 6</option>
            <option value="Tadarus Al-Qur'an">Tadarus Al-Qur'an</option>
            <option value="Tajwid">Tajwid</option>
            <option value="Ghorib">Ghorib</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Halaman</label>
            <input type="text" id="halMengaji" placeholder="Contoh: Hal 12" class="w-full px-3 py-2 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Surah (Jika Tadarus)</label>
            <input type="text" id="surahMengaji" placeholder="Contoh: Al-Baqarah" class="w-full px-3 py-2 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Ayat (Jika Tadarus)</label>
            <input type="text" id="ayatMengaji" placeholder="Contoh: Ayat 1-10" class="w-full px-3 py-2 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nilai / Predikat</label>
            <select id="nilaiMengaji" required class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="A+">A+ (Sangat Baik / Lancar Sempurna)</option>
              <option value="A">A (Baik / Lancar)</option>
              <option value="B+">B+ (Cukup Baik)</option>
              <option value="B">B (Kurang Lancar)</option>
              <option value="B-">B- (Perlu Mengulang)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor WhatsApp Orang Tua (Opsional)</label>
            <input type="tel" id="noWaMengaji" placeholder="Contoh: 628123456789" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Catatan Ustadz / Ustadzah</label>
          <textarea id="catatanMengaji" rows="2" placeholder="Catatan makhroj/kelancaran bacaan..." class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 pt-2">
          <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition shadow">
            💾 Simpan Data Mengaji
          </button>
          <button type="button" onclick="shareWA('mengaji')" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-3 rounded-xl text-xs transition shadow flex items-center justify-center gap-1.5">
            <span>📲 Kirim Laporan WA</span>
          </button>
        </div>
      </form>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUDNPQW8LLPG9AJhJROzyoB5SYQtQ8UB0RLTnPPYw6bHWZV3wfDtXhLXL55jCmaGECIQ/exec";

    const dataSuratPerJuz = {
      "Juz 30": [
        "An-Naba'", "An-Nazi'at", "'Abasa", "At-Takwir", "Al-Infitar", "Al-Mutaffifin", 
        "Al-Inshiqaq", "Al-Buruj", "At-Tariq", "Al-A'la", "Al-Ghashiyah", "Al-Fajr", 
        "Al-Balad", "Ash-Shams", "Al-Layl", "Ad-Duha", "Ash-Sharh", "At-Tin", 
        "Al-'Alaq", "Al-Qadr", "Al-Bayyinah", "Az-Zalzalah", "Al-'Adiyat", "Al-Qari'ah", 
        "At-Takathur", "Al-'Asr", "Al-Humazah", "Al-Fil", "Quraysh", "Al-Ma'un", 
        "Al-Kawthar", "Al-Kafirun", "An-Nasr", "Al-Masad", "Al-Ikhlas", "Al-Falaq", "An-Nas"
      ],
      "Juz 29": [
        "Al-Mulk", "Al-Qalam", "Al-Haqqah", "Al-Ma'arij", "Nuh", "Al-Jinn", 
        "Al-Muzzammil", "Al-Muddaththir", "Al-Qiyamah", "Al-Insan", "Al-Mursalat"
      ],
      "Juz 1": [
        "Al-Fatihah", "Al-Baqarah"
      ]
    };

    document.addEventListener("DOMContentLoaded", () => {
      const rawUser = localStorage.getItem('currentUser');
      if (!rawUser) { window.location.href = "index.html"; return; }
      
      const user = JSON.parse(rawUser);
      document.getElementById('namaGuru').innerText = user.nama || user.username || "Ustadz / Ustadzah";

      if (user.role === 'Admin') {
        document.getElementById('linkAdmin').classList.remove('hidden');
      }

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('tglTahfidz').value = today;
      document.getElementById('tglMengaji').value = today;

      // Ambil daftar santri otomatis dari Google Sheet
      loadDaftarSantri();
    });

    // FUNGSI UNTUK MEMUAT SANTRI DARI MASTER GOOGLE SHEET
    async function loadDaftarSantri() {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "get_daftar_santri" })
        });
        const result = await res.json();

        if (result.success) {
          // Fill Select Tahfidz
          const selT = document.getElementById('santriTahfidz');
          selT.innerHTML = '<option value="">-- Pilih Santri Tahfidz --</option>';
          result.tahfidz.forEach(s => {
            const opt = document.createElement('option');
            opt.value = `${s.nama} (${s.kelas})`;
            opt.textContent = `${s.nama} - ${s.kelas} [${s.nisn}]`;
            selT.appendChild(opt);
          });

          // Fill Select Mengaji
          const selM = document.getElementById('santriMengaji');
          selM.innerHTML = '<option value="">-- Pilih Santri Mengaji --</option>';
          result.mengaji.forEach(s => {
            const opt = document.createElement('option');
            opt.value = `${s.nama} (${s.kelompok})`;
            opt.textContent = `${s.nama} - ${s.kelompok} [${s.nisn}]`;
            selM.appendChild(opt);
          });
        }
      } catch (err) {
        console.error("Gagal memuat daftar santri", err);
      }
    }

    function switchProgram(program) {
      const fT = document.getElementById('formTahfidz');
      const fM = document.getElementById('formMengaji');
      const bT = document.getElementById('btnTabTahfidz');
      const bM = document.getElementById('btnTabMengaji');

      if (program === 'tahfidz') {
        fT.classList.remove('hidden');
        fM.classList.add('hidden');
        bT.className = "flex-1 py-3 text-xs font-bold rounded-xl transition bg-emerald-700 text-white shadow";
        bM.className = "flex-1 py-3 text-xs font-bold rounded-xl transition bg-slate-100 text-slate-600 hover:bg-slate-200";
      } else {
        fM.classList.remove('hidden');
        fT.classList.add('hidden');
        bM.className = "flex-1 py-3 text-xs font-bold rounded-xl transition bg-emerald-700 text-white shadow";
        bT.className = "flex-1 py-3 text-xs font-bold rounded-xl transition bg-slate-100 text-slate-600 hover:bg-slate-200";
      }
    }

    function updateDaftarSurat() {
      const juz = document.getElementById('juzTahfidz').value;
      const selectSurat = document.getElementById('suratTahfidz');
      selectSurat.innerHTML = "";

      if (!juz || !dataSuratPerJuz[juz]) {
        selectSurat.innerHTML = '<option value="">-- Pilih Juz Terlebih Dahulu --</option>';
        return;
      }

      selectSurat.innerHTML = '<option value="">-- Pilih Surah --</option>';
      dataSuratPerJuz[juz].forEach(surat => {
        const opt = document.createElement('option');
        opt.value = surat;
        opt.textContent = surat;
        selectSurat.appendChild(opt);
      });
    }

    document.getElementById('inputTahfidzForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        action: "simpan_setoran_tahfidz",
        tanggal: document.getElementById('tglTahfidz').value,
        santri: document.getElementById('santriTahfidz').value,
        jenisSetoran: document.getElementById('jenisSetoranTahfidz').value,
        juz: document.getElementById('juzTahfidz').value,
        surat: document.getElementById('suratTahfidz').value,
        ayatAwal: document.getElementById('ayatAwalTahfidz').value,
        ayatAkhir: document.getElementById('ayatAkhirTahfidz').value,
        nilai: document.getElementById('nilaiTahfidz').value,
        catatan: document.getElementById('catatanTahfidz').value,
        noWa: document.getElementById('noWaTahfidz').value
      };
      await simpanData(payload, e.target);
    });

    document.getElementById('inputMengajiForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        action: "simpan_setoran_mengaji",
        tanggal: document.getElementById('tglMengaji').value,
        santri: document.getElementById('santriMengaji').value,
        jilid: document.getElementById('jilidMengaji').value,
        halaman: document.getElementById('halMengaji').value,
        surah: document.getElementById('surahMengaji').value,
        ayat: document.getElementById('ayatMengaji').value,
        nilai: document.getElementById('nilaiMengaji').value,
        catatan: document.getElementById('catatanMengaji').value,
        noWa: document.getElementById('noWaMengaji').value
      };
      await simpanData(payload, e.target);
    });

    async function simpanData(payload, formEl) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
          alert("Alhamdulillah! Data setoran berhasil disimpan.");
          document.getElementById('catatanTahfidz').value = "";
          document.getElementById('catatanMengaji').value = "";
        } else {
          alert("Gagal menyimpan: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi saat menyimpan.");
      }
    }

    function shareWA(program) {
      let noHp = "";
      let pesan = "";

      if (program === 'tahfidz') {
        const santri = document.getElementById('santriTahfidz').value;
        const jenis = document.getElementById('jenisSetoranTahfidz').value;
        const juz = document.getElementById('juzTahfidz').value;
        const surat = document.getElementById('suratTahfidz').value;
        const awal = document.getElementById('ayatAwalTahfidz').value;
        const akhir = document.getElementById('ayatAkhirTahfidz').value;
        const nilai = document.getElementById('nilaiTahfidz').value;
        const catatan = document.getElementById('catatanTahfidz').value;
        const tgl = document.getElementById('tglTahfidz').value;
        noHp = document.getElementById('noWaTahfidz').value.trim();

        if (!santri || !surat || !awal || !akhir) {
          alert("Mohon lengkapi data santri, surah, dan ayat terlebih dahulu!");
          return;
        }

        pesan = `*LAPORAN SETORAN TAHFIDZ SDUM PATROL*\n\n` +
                `Assalamu'alaikum Wr. Wb.\n` +
                `Bapak/Ibu Wali Santri dari *${santri}*,\n\n` +
                `Berikut ringkasan setoran hafalan Ananda hari ini (${tgl}):\n` +
                `• *Jenis Setoran:* ${jenis}\n` +
                `• *Juz / Surah:* ${juz} - ${surat}\n` +
                `• *Ayat:* ${awal} s/d ${akhir}\n` +
                `• *Nilai Predikat:* ${nilai}\n` +
                `• *Catatan Ustadz/ah:* ${catatan || '-'}\n\n` +
                `Barakallahu Fiikum. Terus dukung hafalan Ananda di rumah. 🤲`;

      } else {
        const santri = document.getElementById('santriMengaji').value;
        const jilid = document.getElementById('jilidMengaji').value;
        const hal = document.getElementById('halMengaji').value;
        const surah = document.getElementById('surahMengaji').value;
        const ayat = document.getElementById('ayatMengaji').value;
        const nilai = document.getElementById('nilaiMengaji').value;
        const catatan = document.getElementById('catatanMengaji').value;
        const tgl = document.getElementById('tglMengaji').value;
        noHp = document.getElementById('noWaMengaji').value.trim();

        if (!santri || !jilid) {
          alert("Mohon lengkapi data santri dan jilid/program mengaji terlebih dahulu!");
          return;
        }

        let lokasiBacaan = [];
        if (hal) lokasiBacaan.push(hal);
        if (surah) lokasiBacaan.push(`Surah ${surah}`);
        if (ayat) lokasiBacaan.push(`Ayat ${ayat}`);

        pesan = `*LAPORAN SETORAN MENGAJI SDUM PATROL*\n\n` +
                `Assalamu'alaikum Wr. Wb.\n` +
                `Bapak/Ibu Wali Santri dari *${santri}*,\n\n` +
                `Berikut ringkasan bacaan Mengaji Ananda hari ini (${tgl}):\n` +
                `• *Kategori/Jilid:* ${jilid}\n` +
                `• *Detail Bacaan:* ${lokasiBacaan.join(' / ') || '-'}\n` +
                `• *Nilai Predikat:* ${nilai}\n` +
                `• *Catatan Ustadz/ah:* ${catatan || '-'}\n\n` +
                `Barakallahu Fiikum. Terus dampingi bacaan Ananda di rumah. 🤲`;
      }

      if (noHp.startsWith("0")) {
        noHp = "62" + noHp.slice(1);
      }

      const encodedText = encodeURIComponent(pesan);
      const urlWA = noHp ? `https://wa.me/${noHp}?text=${encodedText}` : `https://wa.me/?text=${encodedText}`;
      
      window.open(urlWA, '_blank');
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
