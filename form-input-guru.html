<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Setoran Santri - SDUM Patrol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

  <!-- Header / Navbar -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="flex items-center space-x-3">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Logo_Muhammadiyah.svg/500px-Logo_Muhammadiyah.svg.png" 
             alt="Logo Muhammadiyah" class="h-10 w-10 object-contain bg-white rounded-full p-1">
        <div>
          <h1 class="font-bold text-base leading-tight">Mutaba'ah Anak Unggulan</h1>
          <p class="text-xs text-emerald-200">Panel Input Guru - SDUM Patrol</p>
        </div>
      </div>

      <!-- Live Clock & Hijriah Header -->
      <div class="text-center sm:text-right bg-emerald-800/60 px-3 py-1 rounded-xl text-xs border border-emerald-600/50">
        <p id="jamText" class="font-mono font-bold text-amber-300">00:00:00 WIB</p>
        <p id="tanggalText" class="text-[10px] text-emerald-100">Memuat...</p>
      </div>

      <button onclick="logout()" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-3 py-2 rounded-lg transition font-medium">
        Keluar 🚪
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- Info Guru -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex justify-between items-center">
      <div>
        <p class="text-xs text-slate-500">Ustadz/Ustadzah Pengampu:</p>
        <p id="namaGuru" class="font-bold text-slate-800 text-base">Memuat...</p>
      </div>
      <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full">Peran: Guru</span>
    </div>

    <!-- Switch Tab -->
    <div class="flex bg-slate-200 p-1 rounded-xl mb-6">
      <button id="tabTahfidzBtn" onclick="switchTab('tahfidz')" class="w-1/2 py-2.5 text-sm font-bold rounded-lg transition duration-200 bg-emerald-600 text-white shadow">📖 Setoran Tahfidz</button>
      <button id="tabMengajiBtn" onclick="switchTab('mengaji')" class="w-1/2 py-2.5 text-sm font-bold rounded-lg transition duration-200 text-slate-600 hover:text-slate-900">📚 Setoran Mengaji (Iqro/Tilawati)</button>
    </div>

    <!-- FORM SETORAN TAHFIDZ -->
    <section id="formTahfidz" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Formulir Setoran Tahfidz</h2>
      <form id="tahfidzForm" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="tglTahfidz" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <!-- PILIH SANTRI LENGKAP DENGAN NISN OTOMATIS -->
            <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri Bimbingan</label>
            <select id="selectSantriTahfidz" onchange="autoFillTahfidz()" class="w-full px-3 py-2 border rounded-lg text-sm bg-amber-50 border-amber-300 font-semibold">
              <option value="">-- Pilih Santri --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Santri</label>
            <input type="text" id="namaSantriTahfidz" required placeholder="Nama santri" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">NISN Santri</label>
            <input type="text" id="nisnTahfidz" required placeholder="NISN" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Juz</label>
            <select id="juz" required class="w-full px-3 py-2 border rounded-lg text-sm">
              <option value="Juz 30">Juz 30</option>
              <option value="Juz 29">Juz 29</option>
              <option value="Juz 1">Juz 1</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Surah</label>
            <input type="text" id="surah" required placeholder="An-Naba" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Ayat Awal</label>
            <input type="number" id="ayatAwal" required placeholder="1" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Ayat Akhir</label>
            <input type="number" id="ayatAkhir" required placeholder="15" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nilai</label>
            <select id="nilaiTahfidz" required class="w-full px-3 py-2 border rounded-lg text-sm">
              <option value="A (Sangat Baik)">A (Sangat Baik)</option>
              <option value="B (Baik)">B (Baik)</option>
              <option value="C (Cukup)">C (Cukup)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan</label>
            <input type="text" id="catatanTahfidz" placeholder="Catatan kelancaran" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mt-4">
          <button type="submit" id="btnSubmitTahfidz" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow">💾 Simpan ke Database</button>
        </div>
      </form>
    </section>

    <!-- FORM SETORAN MENGAJI -->
    <section id="formMengaji" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hidden">
      <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Formulir Setoran Mengaji</h2>
      <form id="mengajiForm" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="tglMengaji" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <!-- PILIH SANTRI MENGAJI -->
            <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri Bimbingan</label>
            <select id="selectSantriMengaji" onchange="autoFillMengaji()" class="w-full px-3 py-2 border rounded-lg text-sm bg-amber-50 border-amber-300 font-semibold">
              <option value="">-- Pilih Santri --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Santri</label>
            <input type="text" id="namaSantriMengaji" required placeholder="Nama santri" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">NISN Santri</label>
            <input type="text" id="nisnMengaji" required placeholder="NISN" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Buku / Jilid</label>
            <input type="text" id="bukuJilid" required placeholder="Iqro 3 / Jilid 2" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Halaman</label>
            <input type="text" id="halaman" required placeholder="Hal 12" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Status Kelancaran</label>
            <select id="kelancaran" required class="w-full px-3 py-2 border rounded-lg text-sm">
              <option value="Lancar (Lanjut)">Lancar (Lanjut)</option>
              <option value="Mengulang">Mengulang</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nilai</label>
            <select id="nilaiMengaji" required class="w-full px-3 py-2 border rounded-lg text-sm">
              <option value="A">A (Sangat Baik)</option>
              <option value="B">B (Baik)</option>
              <option value="C">C (Cukup)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan</label>
            <input type="text" id="catatanMengaji" placeholder="Catatan" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>

        <button type="submit" id="btnSubmitMengaji" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow mt-2">💾 Simpan ke Database</button>
      </form>
    </section>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUSrnwqyBJ63rDX9mxKhzX07tpMpSM_ZGR27FP8zpfEKBjriZvlk_WGPLAyup9jKXkdg/exec";
    let dataSantriGuru = { listTahfidz: [], listMengaji: [] };

    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(localStorage.getItem('currentUser'));
      if (!user || user.role !== 'Guru') {
        window.location.href = "index.html";
        return;
      }

      document.getElementById('namaGuru').innerText = user.nama;
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('tglTahfidz').value = today;
      document.getElementById('tglMengaji').value = today;

      // Jalankan Jam & Tanggal
      updateClock();
      setInterval(updateClock, 1000);

      // Ambil daftar anak bimbingan guru ini
      fetchSantriBimbingan(user.nama);
    });

    function updateClock() {
      const now = new Date();
      document.getElementById('jamText').innerText = now.toLocaleTimeString('id-ID', { hour12: false }) + " WIB";

      const opsiMasehi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const masehi = now.toLocaleDateString('id-ID', opsiMasehi);
      const hijriah = new Intl.DateTimeFormat('id-TN-u-ca-islamic', { day: 'numeric', month: 'long', year: 'numeric' }).format(now);

      document.getElementById('tanggalText').innerText = `${masehi} / ${hijriah} H`;
    }

    // AMBIL SANTRY BIMBINGAN
    async function fetchSantriBimbingan(namaGuru) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "get_santri_by_guru", namaGuru: namaGuru })
        });
        const result = await res.json();
        
        if (result.success) {
          dataSantriGuru = result;
          populateDropdowns();
        }
      } catch (err) {
        console.log("Error mengambil anak bimbingan");
      }
    }

    function populateDropdowns() {
      const selTahfidz = document.getElementById('selectSantriTahfidz');
      const selMengaji = document.getElementById('selectSantriMengaji');

      selTahfidz.innerHTML = '<option value="">-- Pilih Santri --</option>';
      dataSantriGuru.listTahfidz.forEach((s, idx) => {
        selTahfidz.innerHTML += `<option value="${idx}">${s.nama} (${s.kelas})</option>`;
      });

      selMengaji.innerHTML = '<option value="">-- Pilih Santri --</option>';
      dataSantriGuru.listMengaji.forEach((s, idx) => {
        selMengaji.innerHTML += `<option value="${idx}">${s.nama} (${s.kelompok})</option>`;
      });
    }

    function autoFillTahfidz() {
      const idx = document.getElementById('selectSantriTahfidz').value;
      if (idx !== "") {
        const s = dataSantriGuru.listTahfidz[idx];
        document.getElementById('namaSantriTahfidz').value = s.nama;
        document.getElementById('nisnTahfidz').value = s.nisn;
      }
    }

    function autoFillMengaji() {
      const idx = document.getElementById('selectSantriMengaji').value;
      if (idx !== "") {
        const s = dataSantriGuru.listMengaji[idx];
        document.getElementById('namaSantriMengaji').value = s.nama;
        document.getElementById('nisnMengaji').value = s.nisn;
      }
    }

    function switchTab(tab) {
      const fT = document.getElementById('formTahfidz');
      const fM = document.getElementById('formMengaji');
      const bT = document.getElementById('tabTahfidzBtn');
      const bM = document.getElementById('tabMengajiBtn');

      if (tab === 'tahfidz') {
        fT.classList.remove('hidden'); fM.classList.add('hidden');
        bT.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg bg-emerald-600 text-white shadow";
        bM.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg text-slate-600";
      } else {
        fM.classList.remove('hidden'); fT.classList.add('hidden');
        bM.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg bg-emerald-600 text-white shadow";
        bT.className = "w-1/2 py-2.5 text-sm font-bold rounded-lg text-slate-600";
      }
    }

    function logout() { localStorage.removeItem('currentUser'); window.location.href = "index.html"; }
  </script>
</body>
</html>
